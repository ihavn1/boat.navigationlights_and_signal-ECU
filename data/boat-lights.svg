         d="m 84.266884,160.17474 c 0,0 5.591329,0.0401 5.591329,0.0401 -0.683798,1.55909 -1.293028,2.94816 -2.759663,4.00063 -1.466636,1.05247 -3.213845,1.35439 -4.832871,0.65684 -1.619025,-0.69756 -2.844583,-2.36171 -3.125461,-4.06979 -0.280878,-1.70807 0.426426,-3.19552 1.163416,-4.7454 z" />
    </g>
  </g>
  
  <!-- NUC Light Upper (Red all-round - Top) -->
  <g id="nuc-upper" class="light" transform="translate(-34.655456,-96.867321)">
    <circle
       style="fill:#ff0000;fill-opacity:1;stroke:#000000;stroke-width:0.212965"
       cx="95.353035"
       cy="115.86769"
       r="3.2021229" />
  </g>
  
  <!-- NUC Light Lower (Red all-round - Bottom) -->
  <g id="nuc-lower" class="light" transform="translate(-34.655456,-96.867321)">
    <circle
       style="fill:#ff0000;fill-opacity:1;stroke:#000000;stroke-width:0.212965"
       cx="82.775291"
       cy="115.86769"
       r="3.2021229" />
  </g>
  
  <!-- All-round White (Anchorage) -->
  <g id="allround-white" class="light" transform="translate(-34.655456,-96.867321)">
    <circle
       style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:0.212965"
       cx="102.6357"
       cy="115.86769"
       r="3.2021229" />
  </g>
</svg>
