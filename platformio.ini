; PlatformIO Project Configuration File
; Navigation Lights and Signal ECU for ESP32
; COLREGs-compliant maritime lighting and sound signal controller

[platformio]
default_envs = az-delivery-devkit-v4

[env:az-delivery-devkit-v4]
; AZ-Delivery ESP32 Dev Kit C V4 target environment
platform = espressif32
board = az-delivery-devkit-v4
framework = arduino
lib_deps = 
    signalk/SensESP@^3.2.0
build_flags = 
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    ; Uncomment next line for active-HIGH relay testing (intermediate hardware)
    -D ACTIVE_HIGH_RELAYS
board_build.partitions = min_spiffs.csv
board_build.filesystem = spiffs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; SPIFFS configuration for web UI files
extra_scripts = 
upload_speed = 460800

[env:native]
; Native test environment (runs on host for CI/fast feedback)
platform = native
test_framework = unity
build_flags = 
    -D UNIT_TEST
    -D NATIVE_BUILD
    -std=c++11
    -I src
lib_deps =
    throwtheswitch/Unity@^2.6.0
test_build_src = yes
build_src_filter = 
    +<*>
    -<main.cpp>
    -<ESP32RelayController.cpp>
    -<ESP32Timer.cpp>
    -<signalk_integration.cpp>
    -<NavigationLightsECU.cpp>
test_ignore = test_signalk_esp32

[env:esp32test]
; ESP32 embedded test environment (runs tests on real hardware)
; test_signalk_esp32 runs ONLY on this environment (requires Arduino.h and hardware)
platform = espressif32
board = az-delivery-devkit-v4
framework = arduino
test_framework = unity
lib_deps = 
    signalk/SensESP@^3.2.0
build_flags = 
    -D UNIT_TEST
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
test_build_src = yes
; Only filter out main.cpp for embedded tests (keep hardware implementations)
build_src_filter = 
    +<*>
    -<main.cpp>
    -<signalk_integration.cpp>
; Ignore native-only tests that use mocks
test_ignore = 
    test_light_controller
    test_sound_controller
    test_state_machine
    test_signalk_integration
