; PlatformIO Project Configuration File
; Navigation Lights and Signal ECU for ESP32
; COLREGs-compliant maritime lighting and sound signal controller

[platformio]
default_envs = esp32dev

[env:esp32dev]
; ESP32 Dev Kit C V4 target environment
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
    SignalK/SensESP@^3.0.0
build_flags = 
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    -D LED_BUILTIN=2
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:native]
; Native test environment (runs on host for CI/fast feedback)
platform = native
test_framework = unity
build_flags = 
    -D UNIT_TEST
    -std=c++11
    -I src
lib_deps =
    throwtheswitch/Unity@^2.6.0
test_build_src = yes
build_src_filter = 
    +<*>
    -<main.cpp>
