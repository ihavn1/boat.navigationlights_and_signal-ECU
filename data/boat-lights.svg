<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Navigation Lights ECU - Boat Diagram -->
<svg
   width="106.88881mm"
   height="38.814194mm"
   viewBox="0 0 106.88881 38.814194"
   version="1.1"
   id="boat-diagram"
   xmlns="http://www.w3.org/2000/svg">
  <defs id="defs1">
    <!-- Path effects preserved for shape rendering -->
  </defs>
  
  <!-- Boat Hull -->
  <g id="hull" transform="translate(-34.655456,-96.867321)">
    <path
       style="fill:none;stroke:#88ccff;stroke-width:0.4;stroke-opacity:0.8"
       d="m 34.739074,116.06933 c 39.574553,32.19409 104.344476,13.23393 104.344476,13.23393 v -12.97943 l 0.12725,-0.12725"
       id="hull-top" />
    <path
       style="fill:none;stroke:#88ccff;stroke-width:0.4;stroke-opacity:0.8"
       d="M 34.739074,116.05142 C 74.313627,83.857325 139.08355,102.81749 139.08355,102.81749 v 12.97943 l 0.12725,0.12725"
       id="hull-bottom" />
    <path
       style="fill:none;stroke:#88ccff;stroke-width:0.15;stroke-opacity:0.5"
       d="m 77.785022,114.85752 29.377008,0.62037 0.0275,1.13094 -29.36053,0.62037"
       id="waterline" />
  </g>
  
  <!-- Port Sidelight (Red - Left when facing forward) -->
  <g id="port-sidelight" class="light" transform="translate(-34.655456,-96.867321)">
    <path
       style="fill:#ff0000;fill-opacity:1;stroke:#000000;stroke-width:0.264999"
       d="m 80.340962,156.04992 c 0,0 2.190822,-5.47509 2.190822,-5.47509 -2.055331,0.10844 -4.442102,0.23436 -5.576017,0.98853 -1.133916,0.75418 -1.887015,2.71661 -2.535534,4.40652 0,0 5.920729,0.08 5.920729,0.08 z"
       transform="matrix(0.88253108,0.00770173,0.00770173,-0.88253108,3.6407263,267.80489)" />
  </g>
  
  <!-- Starboard Sidelight (Green - Right when facing forward) -->
  <g id="starboard-sidelight" class="light" transform="translate(-34.655456,-96.867321)">
    <path
       style="fill:#00ff00;fill-opacity:1;stroke:#000000;stroke-width:0.264999"
       d="m 80.340962,156.04992 c 0,0 2.190822,-5.47509 2.190822,-5.47509 -2.055331,0.10844 -4.442102,0.23436 -5.576017,0.98853 -1.133916,0.75418 -1.887015,2.71661 -2.535534,4.40652 0,0 5.920729,0.08 5.920729,0.08 z"
       transform="matrix(0.88253108,-0.00770173,0.00770173,0.88253108,3.6407263,-35.256063)" />
  </g>
  
  <!-- Yellow Towing Light (Above sternlight) -->
  <g id="yellow-towing-light" class="light" transform="translate(-34.655456,-96.867321)">
    <g transform="translate(25.400262,-58.88479)">
      <path
         style="fill:#ffbb33;fill-opacity:1;stroke:#000000;stroke-width:0.264999"
         transform="matrix(-0.3448455,0.81240508,0.81240508,0.3448455,7.3082704,55.898472)"
         d="m 80.289267,156.02068 c 0,0 -5.826272,-0.0637 -5.826272,-0.0637 1.14864,1.82819 2.424074,3.85818 3.885584,4.48605 1.461509,0.62786 3.834491,0.16523 5.971568,-0.25141 z" />
    </g>
  </g>
  
  <!-- Sternlight (White - Rear) -->
  <g id="sternlight" class="light" transform="translate(-34.655456,-96.867321)">
    <g transform="translate(30.792454,-58.876836)">
      <path
         style="fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:0.264999"
         transform="matrix(-0.3448455,0.81240508,0.81240508,0.3448455,7.3082704,55.890518)"
         d="m 80.289267,156.02068 c 0,0 -5.826272,-0.0637 -5.826272,-0.0637 1.14864,1.82819 2.424074,3.85818 3.885584,4.48605 1.461509,0.62786 3.834491,0.16523 5.971568,-0.25141 z" />
    </g>
  </g>
  
  <!-- Masthead Light (White - Top forward) -->
  <g id="masthead-light" class="light" transform="translate(-34.655456,-96.867321)">
    <g transform="matrix(0.69029854,0,0,0.69029854,37.246843,-3.1555726)">
      <path
